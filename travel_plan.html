<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const sections=[
  ['itinerary','🗓️','行程安排'],
  ['refs','🔗','行程參考資料'],
  ['split','💰','分帳'],
  ['shopping','🛍️','採購清單'],
  ['luggage','🧳','行李清單'],
  ['emergency','☎️','緊急號碼'],
  ['notes','📌','注意事項']
];
const firebaseConfig = {
  apiKey: "AIzaSyBfeRc07HmDiXduRdOmtdaDyqzCwVn7K0A",
  authDomain: "travel-14af6.web.app",
  projectId: "travel-14af6",
  storageBucket: "travel-14af6.firebasestorage.app",
  messagingSenderId: "986313901956",
  appId: "1:986313901956:web:c5333cc75f5d4510c07fd1",
  measurementId: "G-Z4EV9K94NX"
};
let firebaseReady=false, auth=null, db=null, currentUser=null, syncTimer=null;
let sharedUnsubscribers={}, sharedWriteTimers={}, pendingInviteId=new URLSearchParams(location.search).get('share');
let trips=JSON.parse(localStorage.getItem('luluTrips')||'[]'),current=null,section='itinerary',page=0,modalSave=null,activeDayId=null,activeShopId=null,shopMode='view',activePlanId=null;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function persist(changedTrip=null){
  localStorage.setItem('luluTrips',JSON.stringify(trips));
  const target = changedTrip || activeTrip();
  if(target && target.shared && currentUser && db){
    syncSharedTrip(target);
  }
  if(currentUser && db){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(async()=>{
      try{
        const personalTrips=trips.filter(x=>!x.shared);
        const sharedIds=trips.filter(x=>x.shared).map(x=>x.id);
        await db.collection('users').doc(currentUser.uid).set({
          trips:personalTrips,
          sharedTripIds:sharedIds,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
        const s=$('syncStatus'); if(s)s.textContent='☁ 已同步';
      }catch(err){console.error(err);const s=$('syncStatus');if(s)s.textContent='同步失敗';}
    },600);
  }
}

function syncSharedTrip(t){
  if(!t || !t.shared || !db || !currentUser) return;
  clearTimeout(sharedWriteTimers[t.id]);
  sharedWriteTimers[t.id]=setTimeout(async()=>{
    try{
      const payload=JSON.parse(JSON.stringify(t));
      payload.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('sharedTrips').doc(t.id).set(payload,{merge:true});
      const s=$('syncStatus'); if(s)s.textContent='☁ 共享已同步';
    }catch(err){
      console.error(err);
      const s=$('syncStatus'); if(s)s.textContent='共享同步失敗';
    }
  },450);
}

function listenSharedTrip(tripId){
  if(!db || sharedUnsubscribers[tripId]) return;
  sharedUnsubscribers[tripId]=db.collection('sharedTrips').doc(tripId).onSnapshot(doc=>{
    if(!doc.exists) return;
    const data=doc.data();
    data.id=doc.id;
    data.shared=true;
    const idx=trips.findIndex(x=>x.id===doc.id);
    if(idx>=0) trips[idx]=data;
    else trips.unshift(data);
    localStorage.setItem('luluTrips',JSON.stringify(trips));
    if(current===doc.id) renderWorkspace();
    else renderHome();
  },err=>console.error('監聽共享旅程錯誤',err));
}

async function handlePendingInvite(){
  if(!pendingInviteId || !currentUser || !db) return;
  const shareId=pendingInviteId;
  pendingInviteId=null;
  history.replaceState({},'',location.pathname);
  try{
    const ref=db.collection('sharedTrips').doc(shareId);
    const snap=await ref.get();
    if(!snap.exists){
      alert('找不到這個共享旅程連結，可能已被建立者刪除。');
      return;
    }
    const data=snap.data();
    data.id=snap.id;
    data.shared=true;
    const joinedUids=Array.isArray(data.joinedUids)?data.joinedUids:[];
    const maxMembers=Number(data.maxMembers)||4;
    if(!joinedUids.includes(currentUser.uid)){
      if(joinedUids.length>=maxMembers){
        alert(`此旅程的共享人數已達上限（最多 ${maxMembers} 人），無法再加入。`);
        return;
      }
      const myName=prompt(`受邀加入「${data.name||'共享旅程'}」！\n請輸入你在分帳與旅程中的顯示名稱：`,currentUser.displayName||currentUser.email.split('@')[0]);
      if(!myName) return;
      joinedUids.push(currentUser.uid);
      data.joinedUids=joinedUids;
      data.memberProfiles=data.memberProfiles||{};
      data.memberProfiles[currentUser.uid]=myName.trim();
      data.members=Array.isArray(data.members)?data.members:[];
      if(!data.members.includes(myName.trim())) data.members.push(myName.trim());
      await ref.set({
        joinedUids:data.joinedUids,
        memberProfiles:data.memberProfiles,
        members:data.members
      },{merge:true});
    }
    const idx=trips.findIndex(x=>x.id===data.id);
    if(idx>=0) trips[idx]=data; else trips.unshift(data);
    persist(data);
    listenSharedTrip(data.id);
    openTrip(data.id);
    alert(`已成功加入共享旅程「${data.name}」！`);
  }catch(err){

function initFirebase(){
  if(firebaseReady)return true;
  if(!window.firebase || firebaseConfig.apiKey==="YOUR_API_KEY" || firebaseConfig.projectId==="YOUR_PROJECT_ID"){
    alert('請先在 HTML 的 firebaseConfig 填入 Firebase 專案設定。');
    return false;
  }
  try{
    firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();firebaseReady=true;
    auth.getRedirectResult().then(result=>{
      if(result && result.user) currentUser=result.user;
    }).catch(err=>console.error(err));
    auth.onAuthStateChanged(async user=>{
      currentUser=user;
      const btn=document.querySelector('[onclick="googleLogin()"]');
      if(btn)btn.textContent=user?'登出／已登入':'Google 登入／同步';
      const s=$('syncStatus');if(s)s.textContent=user?'☁ 雲端同步中':'';
      if(user){
        try{
          const snap=await db.collection('users').doc(user.uid).get();
          let sharedIds=[];
          if(snap.exists){
            const d=snap.data();
            sharedIds=Array.isArray(d.sharedTripIds)?d.sharedTripIds:[];
            if(Array.isArray(d.trips)){
              const cloudTrips=d.trips;
              const localPersonal=trips.filter(x=>!x.shared);
              const localShared=trips.filter(x=>x.shared);
              if(!localPersonal.length){
                trips=[...cloudTrips,...localShared];
                localStorage.setItem('luluTrips',JSON.stringify(trips));
              }else if(cloudTrips.length && confirm('雲端已有旅程資料。要以雲端資料取代目前這台裝置的私人旅程嗎？按「取消」則保留本機資料並上傳至雲端。')){
                trips=[...cloudTrips,...localShared];
                localStorage.setItem('luluTrips',JSON.stringify(trips));
              }
            }
          }
          trips.filter(x=>x.shared).forEach(x=>{if(!sharedIds.includes(x.id))sharedIds.push(x.id);});
          sharedIds.forEach(id=>listenSharedTrip(id));
          await db.collection('users').doc(user.uid).set({
            trips:trips.filter(x=>!x.shared),
            sharedTripIds:sharedIds,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
          },{merge:true});
          const st=$('syncStatus');if(st)st.textContent='☁ 已同步';
          renderHome();if(current)renderWorkspace();
          await handlePendingInvite();
        }catch(err){console.error(err);alert('讀取雲端資料失敗：'+err.message);}
      }else if(pendingInviteId){
        alert('請先點右上角「Google 登入／同步」登入帳號，即可自動加入朋友分享的旅程！');
      }
    });
    return true;
  }catch(err){console.error(err);alert('Firebase 初始化失敗：'+err.message);return false;}
}

function calcSettlements(members,expenses){
  const bal={};
  (members||[]).forEach(m=>bal[m]=0);
  (expenses||[]).forEach(ex=>{
    const amt=Number(ex.amount)||0;
    const payer=ex.payer;
    const split=(ex.splitWith||[]).filter(Boolean);
    if(!amt || !payer || !split.length) return;
    bal[payer]=(bal[payer]||0)+amt;
    const share=amt/split.length;
    split.forEach(m=>{bal[m]=(bal[m]||0)-share;});
  });
  const debtors=[],creditors=[];
  Object.entries(bal).forEach(([name,v])=>{
    const val=Math.round(v*100)/100;
    if(val<-0.01) debtors.push({name,amt:-val});
    else if(val>0.01) creditors.push({name,amt:val});
  });
  debtors.sort((a,b)=>b.amt-a.amt);
  creditors.sort((a,b)=>b.amt-a.amt);
  const res=[];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay=Math.min(debtors[i].amt,creditors[j].amt);
    res.push({from:debtors[i].name,to:creditors[j].name,amount:Math.round(pay*10)/10});
    debtors[i].amt-=pay;
    creditors[j].amt-=pay;
    if(debtors[i].amt<0.01) i++;
    if(creditors[j].amt<0.01) j++;
  }
  return res;
}

      </div>
    </div>
  `,()=>{
    calcEval();
    const amt=parseFloat($('ex_amount').value);

function calcInput(ch){const inp=$('ex_amount');if(inp)inp.value=(inp.value||'')+ch;}
function calcClear(){const inp=$('ex_amount');if(inp)inp.value='';}
function calcBack(){const inp=$('ex_amount');if(inp)inp.value=(inp.value||'').slice(0,-1);}
function calcEval(){
  const inp=$('ex_amount');if(!inp)return;
  const expr=(inp.value||'').replace(/[^0-9+\-*/.()]/g,'');
  if(!expr)return;
  try{
    const val=Function('"use strict";return ('+expr+')')();
    if(typeof val==='number' && isFinite(val)) inp.value=Math.round(val*100)/100;
  }catch(e){}
}

function attachDaySwipe(el){
  let sx=0,sy=0;
  const start=(x,y)=>{sx=x;sy=y;};
  const end=(x,y,target)=>{
    if(!sx)return;
    const dx=x-sx,dy=y-sy;
    const startX=sx; sx=0;
    if(startX<=35) return; // 最左側保留給邊緣返回手勢
    if(target?.closest?.('.day-tabs,.carousel-track,button,input,textarea,a'))return;
    if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){
      const trip=activeTrip(),i=trip.days.findIndex(x=>x.id===activeDayId);
      if(dx<0&&i<trip.days.length-1)switchDay(trip.days[i+1].id);
      else if(dx>0&&i>0)switchDay(trip.days[i-1].id);
    }
  };
  el.ontouchstart=e=>{const t=e.touches[0];start(t.clientX,t.clientY);};
  el.ontouchend=e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY,e.target);};
  el.onpointerdown=e=>{if(e.pointerType==='mouse')start(e.clientX,e.clientY);};
  el.onpointerup=e=>{if(e.pointerType==='mouse')end(e.clientX,e.clientY,e.target);};
}

  const picked=files.slice(0,remain);

function compressImageFile(file,done){
  if(!file.type.startsWith('image/')){alert('請選擇圖片檔案');return;}
  if(file.size>12*1024*1024){alert('圖片請選擇 12MB 以下的檔案。');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const image=new Image();
    image.onload=()=>{
      const max=1000,scale=Math.min(1,max/Math.max(image.width,image.height));
      const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      done(canvas.toDataURL('image/jpeg',0.74));
    };
    image.onerror=()=>alert('圖片讀取失敗，請換一張圖片。');
    image.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function deleteEntry(kind,id,tab){

let isLoggingIn = false;
async function googleLogin(){
  if(isLoggingIn) return;
  if(currentUser && auth){
    if(confirm('目前登入帳號：' + (currentUser.email || '') + '\n要登出嗎？')){
      await auth.signOut();
    }
    return;
  }
  if(!initFirebase()) return;
  isLoggingIn = true;
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if(isStandalone){
      const email = prompt('請輸入同步用的 Email 信箱：');
      if(!email){ isLoggingIn = false; return; }
      const password = prompt('請輸入同步密碼（至少 6 個字元）：');
      if(!password){ isLoggingIn = false; return; }
      await auth.signInWithEmailAndPassword(email.trim(), password);
    } else {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      const methods = await auth.fetchSignInMethodsForEmail(result.user.email);
      if(!methods.includes('password')){
        const newPwd = prompt('請為手機 App 設定一組同步密碼（至少 6 個字元）：');
        if(newPwd && newPwd.length >= 6){
          const cred = firebase.auth.EmailAuthProvider.credential(result.user.email, newPwd);
          await result.user.linkWithCredential(cred);
          alert('手機同步密碼綁定成功！現在手機 App 可以直接用此信箱與密碼登入了。');
        }
      }
    }
  }
  catch(err){
    if(err.code !== 'auth/cancelled-popup-request'){
      console.error(err);
      alert('登入失敗：' + err.message);
    }
  }
  isLoggingIn = false;
}
renderHome();
initFirebase();

/* 視覺特效＋iPhone 左側邊緣滑動返回＋iOS PWA 外部連結外開 */
(function(){
  const style = document.createElement('style');
  style.textContent = `@keyframes xmasFall{0%{transform:translate(0,-20px) rotate(0deg);opacity:0}15%{opacity:0.8}50%{transform:translate(16px,50vh) rotate(180deg)}85%{opacity:0.8}100%{transform:translate(-12px,105vh) rotate(360deg);opacity:0}}.xmas-flake{position:fixed;top:-20px;pointer-events:none;z-index:9999;user-select:none;animation:xmasFall ease-in-out forwards}@keyframes starPop{0%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}45%{transform:translate(-50%,-95%) scale(1.22) rotate(18deg)}100%{transform:translate(-50%,-130%) scale(0.95) rotate(32deg)}}.click-star{position:fixed;pointer-events:none;z-index:10000;user-select:none;width:55px;height:55px;animation:starPop 0.28s ease-out forwards}.lying-pikmin{position:fixed;right:-58px;bottom:4px;width:238px;height:auto;pointer-events:none;z-index:9998;user-select:none}`;
  document.head.appendChild(style);
  const icons = ['❄', '❅', '✦', '✧', '⋆'];
  const colors = ['#b4c4d8', '#d4c391', '#c4d1e2', '#e2d2a4'];
  function spawnFlake(){
    if(document.hidden) return;
    const el = document.createElement('div');
    el.className = 'xmas-flake';
    const icon = icons[Math.floor(Math.random() * icons.length)];
    el.textContent = icon;
    el.style.left = (2 + Math.random() * 94) + 'vw';
    const baseSize = 11 + Math.random() * 8;
    const isStar = (icon === '✦' || icon === '✧' || icon === '⋆');
    el.style.fontSize = (isStar ? baseSize * 1.35 : baseSize) + 'px';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    const duration = 5.5 + Math.random() * 4;
    el.style.animationDuration = duration + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }
  function spawnFlurry(){
    const count = 5 + Math.floor(Math.random() * 4);
    for(let i = 0; i < count; i++){
      setTimeout(spawnFlake, i * (250 + Math.random() * 350));
    }
  }
  spawnFlurry();
  setInterval(spawnFlurry, 6500);

  const starColors = ['#f0c8d2', '#ebd8a6', '#b8d0e8', '#c2dec9', '#d5cae6'];
  document.addEventListener('pointerdown', function(e){
    const btn = e.target.closest('button');
    if(btn && !btn.closest('header') && !btn.closest('.topnav')){
      const rect = btn.getBoundingClientRect();
      const color = starColors[Math.floor(Math.random() * starColors.length)];
      const star = document.createElement('div');
      star.className = 'click-star';
      star.innerHTML = `<svg viewBox="0 0 24 24" width="55" height="55"><path fill="${color}" d="M12 2.2l2.9 6.1 6.7.9-4.9 4.7 1.2 6.7L12 17.4l-5.9 3.2 1.2-6.7-4.9-4.7 6.7-.9z"/></svg>`;
      star.style.left = (rect.left + rect.width / 2) + 'px';
      star.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 280);
    }
  });

  // iPhone 左側邊緣滑動返回上一頁（Edge Swipe Back）
  let edgeStartX = 0, edgeStartY = 0, isEdgeSwipe = false;
  document.addEventListener('touchstart', function(e){
    const t = e.touches[0];
    if(t && t.clientX <= 35){
      edgeStartX = t.clientX;
      edgeStartY = t.clientY;
      isEdgeSwipe = true;
    } else {
      isEdgeSwipe = false;
    }
  }, {passive: true});

  document.addEventListener('touchend', function(e){
    if(!isEdgeSwipe) return;
    isEdgeSwipe = false;
    const t = e.changedTouches[0];
    if(!t) return;
    const dx = t.clientX - edgeStartX;
    const dy = Math.abs(t.clientY - edgeStartY);
    if(dx > 65 && dx > dy * 1.4){
      const modal = document.getElementById('modalbg');
      if(modal && modal.style.display === 'flex'){
        closeModal();
        return;
      }
      const panelBack = document.querySelector('#panel .back');
      if(panelBack){ panelBack.click(); return; }
      const wsBack = document.querySelector('#workspace > .back');
      if(wsBack && document.getElementById('workspace').style.display !== 'none'){ wsBack.click(); }
    }
  }, {passive: true});

  // 修復 iOS PWA 模式下外部連結點了沒反應的問題
  document.addEventListener('click', function(e){
    const a = e.target.closest('a');
    if(!a) return;
    let href = (a.getAttribute('href') || '').trim();
    if(!href || href === '#' || href.startsWith('javascript:')) return;
    if(!/^https?:\/\//i.test(href) && !href.startsWith('mailto:') && !href.startsWith('tel:')){
      href = 'https://' + href;
    }
    if(href.startsWith('http')){
      e.preventDefault();
      e.stopPropagation();
      const ext = document.createElement('a');
      ext.href = href;
      ext.target = '_blank';
      ext.rel = 'noopener noreferrer';
      ext.style.display = 'none';
      document.body.appendChild(ext);
      ext.click();
      setTimeout(() => ext.remove(), 100);
    }
  }, true);

  const pikmin = document.createElement('img');
  pikmin.className = 'lying-pikmin';
  pikmin.src = 'pppk.gif';
  document.body.appendChild(pikmin);
})();
